[package]
name = "kampela-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-consensus = { version = "1.6.1", default-features = false, features = ["serde"] }
alloy-primitives = { version = "1.5.4", default-features = false, features = ["serde"] }
libsecp256k1 = { version = "0.7.1", default-features = false, features = ["static-context", "hmac"] }
clear-signing = { git = "ssh://git@github.com/Kalapaja/clear-signing.git", default-features = false, features = ["serde"] }
clear-signing-format = { git = "ssh://git@github.com/Kalapaja/clear-signing.git", default-features = false, features = ["serde"] }
embedded-graphics = "0.7.1"
embedded-text = {version = "0.5.0", default-features = false}
hex = {version = "0.4.3", default-features = false, features = ["alloc"]}
kampela-display-common = { path = "../kampela-display-common" }
qrcodegen-no-heap = { version = "1.8.1" }
rand = { version = "0.8.5", default_features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
#ux = { version = "0.1.3", default_features = false }

[features]
default = ["std"]
std = ["rand/default"]
embed = []
