[package]
name = "kampela-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-consensus = { version = "1.0.22", default-features = false }
alloy-eips = { version = "1.0.22", default-features = false }
alloy-primitives = { version = "1.2.1", default-features = false }
alloy-rlp = { version = "0.3.12", default-features = false }
alloy-dyn-abi = {version = "1.2.1", default-features = false, features = ["eip712"]}
bitcoin = {version ="0.32.6", default-features = false, features = ["secp-lowmemory", "secp-recovery"] }
embedded-graphics = "0.7.1"
embedded-text = { version = "0.5.0", default-features = false }
eth-sign-request-parser = { path = "../../eth-sign-request-parser", default-features = false, features = ["eip712"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hmac = "0.12.1"
kampela-display-common = { path = "../kampela-display-common" }
lazy_static = { version = "1.4.0", default-features = false }
minicbor = { version = "0.19.1", default-features = false, features = ["alloc"] }
mnemonic-external = { version = "0.1.0", default-features = false }
pbkdf2 = {version = "0.12.2", default-features = false}
qrcodegen-no-heap = { version = "1.8.1" }
rand = { version = "0.8.5", default-features = false }
serde_json = { version = "1.0.141", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10.8", default-features = false }
#substrate-crypto-light = { path = "../../substrate-crypto-light", default-features = false, features = ["sr25519"] }
#substrate_parser = { path = "../../substrate-parser", default-features = false, features = ["sr25519"]}
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
#ux = { version = "0.1.3", default-features = false }
ur = { git = "https://github.com/dspicher/ur-rs/", branch = "no-std", default-features = false }
uuid = { version = "0.8.2", default-features = false }

[features]
default = ["std"]
std = ["rand/default"]
embed = ["lazy_static/spin_no_std"]
